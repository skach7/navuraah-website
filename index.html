  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #1a1040;
      color: #fdf4e7;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #1a1040; }
    ::-webkit-scrollbar-thumb { background: #2d1b69; border-radius: 2px; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes drift {
      0% { transform: translateY(0px) translateX(0px); }
      33% { transform: translateY(-12px) translateX(6px); }
      66% { transform: translateY(6px) translateX(-8px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 40px 10px rgba(245,158,11,0.15); }
      50% { box-shadow: 0 0 70px 20px rgba(245,158,11,0.28); }
    }
    @keyframes orbGlow {
      0%, 100% { filter: drop-shadow(0 0 30px rgba(245,158,11,0.3)) drop-shadow(0 0 60px rgba(107,158,126,0.15)); }
      50% { filter: drop-shadow(0 0 50px rgba(245,158,11,0.5)) drop-shadow(0 0 90px rgba(107,158,126,0.25)); }
    }
    @keyframes orbRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ringExpand {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes waveform {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }
  </style>

// --- Starfield ---
function Starfield() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight * 2.5;
    const stars = Array.from({length: 180}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.4 + 0.3,
      delay: Math.random() * 4,
      dur: Math.random() * 3 + 2,
    }));
    let frame;
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      const t = Date.now() / 1000;
      stars.forEach(s => {
        const alpha = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin((t + s.delay) / s.dur * Math.PI * 2));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(253,244,231,${alpha * 0.7})`;
        ctx.fill();
      });
      frame = requestAnimationFrame(draw);
    };
    draw();
    const resize = () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight * 2.5;
    };
    window.addEventListener('resize', resize);
    return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', top:0, left:0, width:'100%', height:'250vh', pointerEvents:'none', zIndex:0, opacity:0.9 }} />;
}

// --- App ---
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  return (
    <>
      <Starfield />
      <Nav />
      <Hero tweaks={tweaks} />
      <HowItWorks />
      <Features />
      <VoiceCallout />
      {tweaks.showTestimonials && <Testimonials />}
      <WaitlistCTA tweaks={tweaks} />
      <Footer />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={showTweaks} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
